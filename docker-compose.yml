services:

  app:
    build:
      context: .
      dockerfile: Dockerfile


    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: assessment
      DB_USER: appuser
      DB_PASSWORD: apppassword

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine


    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d assessment"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
